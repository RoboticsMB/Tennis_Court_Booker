name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m playwright install --with-deps chromium
      # Browser tests intentionally use headless=False; xvfb supplies CI's display.
      - run: xvfb-run -a python -m pytest -m "not live"
