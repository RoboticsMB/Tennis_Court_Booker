name: Reserve tennis court

on:
  schedule:
    # GitHub cron is UTC. Run every hour at :50; the application filters hours
    # using America/New_York and waits for the exact local release boundary. y
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fill and verify the form without submitting
        type: boolean
        default: false

concurrency:
  group: tennis-court-reservation
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and Chromium
        run: |
          python -m pip install .
          python -m playwright install --with-deps chromium

      - name: Run reservation flow
        run: python -m tennis_booker
        env:
          BOOKER_FIRST_NAME: ${{ secrets.BOOKER_FIRST_NAME }}
          BOOKER_LAST_NAME: ${{ secrets.BOOKER_LAST_NAME }}
          BOOKER_EMAIL: ${{ secrets.BOOKER_EMAIL }}
          FAILURE_WEBHOOK_URL: ${{ secrets.FAILURE_WEBHOOK_URL }}
          PREFERRED_COURTS: ${{ vars.PREFERRED_COURTS }}
          RESERVATION_HOURS: ${{ vars.RESERVATION_HOURS || '8-22' }}
          RESERVATION_TIMEZONE: America/New_York
          BOOKING_DAYS_AHEAD: ${{ vars.BOOKING_DAYS_AHEAD || '2' }}
          RELEASE_LEAD_MINUTES: ${{ vars.RELEASE_LEAD_MINUTES || '10' }}
          LATE_START_GRACE_MINUTES: ${{ vars.LATE_START_GRACE_MINUTES || '10' }}
          HEADLESS: "true"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
