[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-court-booker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright==1.52.0", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
markers = [
    "browser: launches a real Chromium browser (headed by default)",
    "live: accesses the live reservation pages but never submits the form",
]
